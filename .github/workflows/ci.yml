name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waymark
          POSTGRES_PASSWORD: waymark
          POSTGRES_DB: waymark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waymark -d waymark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://waymark:waymark@localhost:5432/waymark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install cwebp (photo uploads)
        # Ubuntu's mirrors occasionally fail a fetch; retry rather than fail the run.
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 webp && exit 0
            echo "apt failed (attempt $i); retrying in 20s"; sleep 20
          done
          exit 1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - name: Why tests failed
        if: failure()
        run: node scripts/ci-failures.mjs test-results/results.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: waymark-gear:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # INSTALL.md's server steps, run for real on this build: install.sh,
      # HTTPS through Caddy, the owner account, and every waymark command.
      - name: Install guide works (test/install/run.sh)
        run: sudo --preserve-env=GITHUB_ACTIONS bash test/install/run.sh waymark-gear:test
