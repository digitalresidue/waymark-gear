# Production stack for a single server: Caddy (HTTPS) -> app -> Postgres.
#
# deploy/install.sh puts this in /opt/waymark with the Caddyfile and a
# filled-in .env, and the `waymark` command runs it (waymark status,
# waymark update, ...). See INSTALL.md. By hand:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Migrations run automatically when the app starts.

# A fixed name, so volumes are always waymark_pgdata, waymark_userimages...
# whatever folder this file is in (backup.sh relies on it).
name: waymark

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # Built and published by .github/workflows/release.yml.
    image: ${APP_IMAGE:-ghcr.io/digitalresidue/waymark-gear:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Caddy is the one proxy in front of the app.
      TRUST_PROXY: 1
      DATABASE_URL: postgres://waymark:${POSTGRES_PASSWORD}@db:5432/waymark
      DEPLOY_URL: https://${SITE_DOMAIN}
    volumes:
      - userimages:/app/public/userimages
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host: only Caddy reaches it.
    expose:
      - "3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: waymark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waymark -d waymark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  userimages:
